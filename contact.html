.nav {

}

.hh-form {

}

.hh-form-row {

}

  border-right: 0;

}

.hh-email::placeholder {

}

.hh-email:focus {
  border-color: var(--grey);
}

.hh-submit {

  padding: 6px 11px;

  border-radius: 0;
  background: transparent;
  color: var(--grey);

  border-color: var(--grey);
}

}

.hh-success {

.square {

  padding: 7px 10px;

  background: transparent;
  color: var(--grey);

footer {

.settings {

}

.settings-head,

.setting-actions {

body.dark {

<script
  src="https://groot.mailerlite.com/js/w/webforms.min.js?v83147fa8ce2d95cb73ece7f28b469519"
  type="text/javascript"
></script>

<script>
fetch(
  "https://assets.mailerlite.com/jsonp/2630720/forms/198354712118953334/takel"
);
</script>

<script>
(() => {

  const root =
    document.documentElement;

  const body =
    document.body;

  const panel =
    document.getElementById('settings');

  const openBtn =
    document.getElementById('settingsOpen');

  const closeBtn =
    document.getElementById('settingsClose');

  const lightBtn =
    document.getElementById('lightBtn');

  const darkBtn =
    document.getElementById('darkBtn');

  const resetBtn =
    document.getElementById('resetBtn');

  const setPanel = (open) => {

    panel.classList.toggle(
      'open',
      open
    );

    panel.setAttribute(
      'aria-hidden',
      String(!open)
    );

  };

  openBtn.addEventListener(
    'click',
    () => setPanel(true)
  );

  closeBtn.addEventListener(
    'click',
    () => setPanel(false)
  );

  const savedSize =
    localStorage.getItem(
      'hh-size'
    );

  if (savedSize) {

    root.style.setProperty(
      '--ui',
      `${savedSize}px`
    );

  }

  document
    .querySelectorAll('[data-size]')
    .forEach((button) => {

      button.addEventListener(
        'click',
        () => {

          const size =
            button.dataset.size;

          root.style.setProperty(
            '--ui',
            `${size}px`
          );

          localStorage.setItem(
            'hh-size',
            size
          );

        }
      );

    });

  if (
    localStorage.getItem(
      'hh-theme'
    ) === 'dark'
  ) {

    body.classList.add(
      'dark'
    );

  }

  darkBtn.addEventListener(
    'click',
    () => {

      body.classList.add(
        'dark'
      );

      localStorage.setItem(
        'hh-theme',
        'dark'
      );

    }
  );

  lightBtn.addEventListener(
    'click',
    () => {

      body.classList.remove(
        'dark'
      );

      localStorage.setItem(
        'hh-theme',
        'light'
      );

    }
  );

  resetBtn.addEventListener(
    'click',
    () => {

      localStorage.removeItem(
        'hh-size'
      );

      localStorage.removeItem(
        'hh-theme'
      );

      root.style.setProperty(
        '--ui',
        '10.5px'
      );

      body.classList.remove(
        'dark'
      );

    }
  );

})();
</script>
