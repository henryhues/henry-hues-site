 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
<meta name="description" content="Official website of Henry Hues — artist, producer and sound curator based between Paris and New York. Explore music, archive, upcoming projects and contact.">

<title>Henry Hues — Artist, Producer & Sound Curator</title>

<link rel="canonical" href="https://henryhues.net/">

<meta property="og:title" content="Henry Hues — Artist, Producer & Sound Curator">
<meta property="og:description" content="Official website of Henry Hues — artist, producer and sound curator based between Paris and New York.">
<meta property="og:url" content="https://henryhues.net/">
<meta property="og:type" content="profile">
<meta property="og:site_name" content="Henry Hues">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Henry Hues — Artist, Producer & Sound Curator">
<meta name="twitter:description" content="Official website of Henry Hues — artist, producer and sound curator based between Paris and New York.">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Henry Hues",
  "url": "https://henryhues.net/",
  "description": "Artist, producer and sound curator based between Paris and New York.",
  "jobTitle": "Artist, Producer & Sound Curator"
}
</script>

<style>
:root {
  --lilac: #d8cfd9;
  --sand: #f5f3ef;
  --grey: #858585;
  --white: #f7f6f3;
  --line: rgba(133,133,133,.28);
  --ui: 10.5px;
  --title: 14px;
}

* {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--sand);
  color: var(--grey);
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: var(--ui);
  line-height: 1.35;
  -webkit-font-smoothing: antialiased;
}

a,
button {
  font: inherit;
  color: inherit;
}

a {
  text-decoration: none;
}

button {
  border: 0;
  background: none;
  padding: 0;
}

.shell {
  min-height: 100vh;
}

.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 18px 24px;
  color: var(--white);
}

.brand {
  margin-right: auto;
  font-weight: 500;
}

.nav {
  display: flex;
  gap: 18px;
  align-items: center;
  white-space: nowrap;
}

.nav a,
.nav button {
  font-size: 10px;
  color: var(--white);
}

.hero {
  min-height: 100vh;
  background: var(--lilac);
  display: flex;
  align-items: center;
  padding: 70px 6vw 58px;
}

.hero h1 {
  margin: 0;
  color: var(--white);
  font-size: clamp(68px, 11vw, 150px);
  line-height: .78;
  letter-spacing: -.065em;
  font-weight: 300;
  text-transform: uppercase;
}

footer {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 14px 24px 16px;
  color: var(--grey);
  font-size: 9px;
  z-index: 20;
}

.settings {
  position: fixed;
  right: 14px;
  bottom: 14px;
  z-index: 80;
  width: min(300px, calc(100vw - 28px));
  padding: 15px;
  background: var(--sand);
  border: 1px solid var(--line);
  display: none;
}

.settings.open {
  display: block;
}

.settings-head,
.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}

.settings-head {
  padding-bottom: 11px;
}

.setting-row {
  border-top: 1px solid var(--line);
  padding: 10px 0;
}

.square {
  border: 1px solid var(--line);
  padding: 6px 9px;
  border-radius: 0;
  background: transparent;
}

.setting-actions {
  display: flex;
  gap: 5px;
}

body.dark {
  --sand: #5a535c;
  --lilac: #756b77;
  --grey: #d4d0d2;
  --white: #f7f6f3;
  --line: rgba(247,246,243,.22);
}

@media (max-width: 720px) {
  .topbar {
    padding: 16px 14px;
    gap: 12px;
  }

  .nav {
    gap: 12px;
  }

  .hero {
    padding: 68px 24px 50px;
  }

  .hero h1 {
    font-size: clamp(66px, 22vw, 100px);
  }

  footer {
    padding: 12px 14px 14px;
  }
}
</style>
</head>

<body>

<div class="shell">

<header class="topbar">
  <a class="brand" href="index.html">HH</a>

  <nav class="nav" aria-label="Primary">
    <a href="archive.html" target="_blank" rel="noopener">Archive</a>
    <a href="upcoming.html" target="_blank" rel="noopener">Upcoming</a>
    <a href="contact.html">Contact</a>
    <button id="settingsOpen" type="button">Settings</button>
  </nav>
</header>

<main class="hero">
  <h1>HENRY<br>HUES</h1>
</main>

<footer>
  <span>Henry Hues © 2026</span>
  <span>Paris · New York</span>
</footer>

</div>

<aside class="settings" id="settings" aria-hidden="true">

  <div class="settings-head">
    <span>Settings</span>
    <button class="square" id="settingsClose" type="button">Close</button>
  </div>

  <div class="setting-row">
    <span>Text size</span>

    <div class="setting-actions">
      <button class="square" data-size="10" type="button">A−</button>
      <button class="square" data-size="10.5" type="button">A</button>
      <button class="square" data-size="12.5" type="button">A+</button>
    </div>
  </div>

  <div class="setting-row">
    <span>Theme</span>

    <div class="setting-actions">
      <button class="square" id="lightBtn" type="button">Light</button>
      <button class="square" id="darkBtn" type="button">Dark</button>
    </div>
  </div>

  <div class="setting-row">
    <span>Reset</span>
    <button class="square" id="resetBtn" type="button">Reset</button>
  </div>

</aside>

<script>
(() => {
  const root = document.documentElement;
  const body = document.body;

  const panel = document.getElementById('settings');
  const openBtn = document.getElementById('settingsOpen');
  const closeBtn = document.getElementById('settingsClose');
  const lightBtn = document.getElementById('lightBtn');
  const darkBtn = document.getElementById('darkBtn');
  const resetBtn = document.getElementById('resetBtn');

  const setPanel = (open) => {
    panel.classList.toggle('open', open);
    panel.setAttribute('aria-hidden', String(!open));
  };

  openBtn.addEventListener('click', () => setPanel(true));
  closeBtn.addEventListener('click', () => setPanel(false));

  const savedSize = localStorage.getItem('hh-size');

  if (savedSize) {
    root.style.setProperty('--ui', `${savedSize}px`);
  }

  document.querySelectorAll('[data-size]').forEach((button) => {
    button.addEventListener('click', () => {
      const size = button.dataset.size;

      root.style.setProperty('--ui', `${size}px`);
      localStorage.setItem('hh-size', size);
    });
  });

  if (localStorage.getItem('hh-theme') === 'dark') {
    body.classList.add('dark');
  }

  darkBtn.addEventListener('click', () => {
    body.classList.add('dark');
    localStorage.setItem('hh-theme', 'dark');
  });

  lightBtn.addEventListener('click', () => {
    body.classList.remove('dark');
    localStorage.setItem('hh-theme', 'light');
  });

  resetBtn.addEventListener('click', () => {
    localStorage.removeItem('hh-size');
    localStorage.removeItem('hh-theme');

    root.style.setProperty('--ui', '10.5px');
    body.classList.remove('dark');
  });
})();
</script>

</body>
</html>
